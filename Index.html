<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SCM Piura - Panel de Control</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --scm-primary: #0b5cab;
      --scm-primary-dark: #0a3f76;
      --scm-accent: #d8892b;
      --scm-ink: #1f3349;
      --scm-soft: #eef4f8;
      --scm-border: #d9e2ea;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(11, 92, 171, 0.08), transparent 28%),
        linear-gradient(180deg, #f8fbfd 0%, #edf3f7 100%);
      color: var(--scm-ink);
    }

    .panel-card {
      border: 0;
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(31, 51, 73, 0.08);
    }

    .stat-card {
      border: 1px solid var(--scm-border);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 10px 28px rgba(31, 51, 73, 0.06);
    }

    .stat-label {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b7c8f;
    }

    .app-header {
      background: linear-gradient(135deg, rgba(11, 92, 171, 0.08), rgba(216, 137, 43, 0.08));
      border: 1px solid var(--scm-border);
      border-radius: 22px;
      padding: 1.5rem;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--scm-primary-dark);
    }

    .soft-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      background: rgba(11, 92, 171, 0.08);
      color: var(--scm-primary-dark);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .module-tabs {
      display: inline-flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--scm-border);
      border-radius: 999px;
      padding: 0.35rem;
    }

    .module-tab {
      border: 0;
      background: transparent;
      color: #5b6e82;
      border-radius: 999px;
      padding: 0.65rem 1rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .module-tab.active {
      background: var(--scm-primary);
      color: #fff;
      box-shadow: 0 10px 20px rgba(11, 92, 171, 0.18);
    }

    .module-view {
      display: none;
    }

    .module-view.active {
      display: block;
    }

    .log-panel {
      border: 1px solid var(--scm-border);
      border-radius: 16px;
      background: #fff;
    }

    .log-entry + .log-entry {
      border-top: 1px solid var(--scm-border);
    }

    .quadrilla-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
    }

    .quadrilla-card {
      border: 1px solid var(--scm-border);
      border-radius: 16px;
      padding: 1rem;
      background: linear-gradient(180deg, #ffffff 0%, #f7fafc 100%);
    }

    .filter-panel {
      border: 1px solid var(--scm-border);
      border-radius: 16px;
      background: #fff;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.75rem;
    }

    .detail-item {
      border: 1px solid var(--scm-border);
      border-radius: 14px;
      padding: 0.85rem 1rem;
      background: #fbfdff;
    }

    .detail-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #708399;
      margin-bottom: 0.35rem;
    }

    .detail-value {
      font-size: 0.95rem;
      color: var(--scm-ink);
      word-break: break-word;
    }

    .list-filter-group {
      display: inline-flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .list-advanced-filters {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.75rem;
      align-items: end;
    }

    .list-advanced-filters .filter-field {
      min-width: 0;
    }

    .list-filter-btn {
      border: 1px solid var(--scm-border);
      border-radius: 999px;
      background: #fff;
      color: #5b6e82;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.45rem 0.85rem;
      transition: all 0.2s ease;
    }

    .list-filter-btn.active {
      background: var(--scm-primary);
      color: #fff;
      border-color: var(--scm-primary);
      box-shadow: 0 10px 20px rgba(11, 92, 171, 0.16);
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 96px;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    .status-chip.done {
      background: rgba(24, 146, 84, 0.14);
      color: #146c43;
    }

    .status-chip.pending {
      background: rgba(216, 137, 43, 0.14);
      color: #a45d13;
    }

    .status-chip.blocked {
      background: rgba(216, 137, 43, 0.18);
      color: #8a4b11;
    }

    .status-chip.removed {
      background: rgba(196, 61, 61, 0.14);
      color: #9f1f1f;
    }

    .status-chip.neutral {
      background: rgba(11, 92, 171, 0.08);
      color: var(--scm-primary-dark);
    }

    .list-reading-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(88px, 1fr));
      gap: 0.35rem;
      min-width: 190px;
    }

    .list-reading-pill {
      display: flex;
      flex-direction: column;
      gap: 0.08rem;
      padding: 0.35rem 0.45rem;
      border: 1px solid var(--scm-border);
      border-radius: 10px;
      background: #fbfdff;
      line-height: 1.1;
    }

    .list-reading-key {
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #708399;
    }

    .list-reading-val {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--scm-ink);
      word-break: break-word;
    }

    .padron-list-scroll {
      max-height: 580px;
      overflow: auto;
      border: 1px solid var(--scm-border);
      border-radius: 14px;
    }

    .padron-list-scroll thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f8fbfd;
      box-shadow: inset 0 -1px 0 var(--scm-border);
    }

    #panelResumenGrid.padron-fullscreen-active #panelResumenListadoCol {
      flex: 0 0 100%;
      max-width: 100%;
    }

    #panelResumenGrid.padron-fullscreen-active #panelResumenDetalleCol {
      display: none;
    }

    #panelResumenGrid.padron-fullscreen-active #panelResumenListadoCard {
      min-height: 82vh;
    }

    #panelResumenGrid.padron-fullscreen-active #listadoSuministrosContainer .padron-list-scroll {
      max-height: 72vh;
    }

    .detail-scroll-panel {
      max-height: 72vh;
      overflow-y: auto;
      padding-right: 0.35rem;
      scrollbar-gutter: stable;
    }

    .detail-scroll-panel::-webkit-scrollbar {
      width: 10px;
    }

    .detail-scroll-panel::-webkit-scrollbar-thumb {
      background: rgba(112, 131, 153, 0.4);
      border-radius: 999px;
    }

    .detail-scroll-panel::-webkit-scrollbar-track {
      background: transparent;
    }

    .detail-summary-card {
      border: 1px solid var(--scm-border);
      border-radius: 16px;
      padding: 1rem;
      background: linear-gradient(180deg, #ffffff 0%, #f4f8fb 100%);
    }

    .detail-kicker {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #708399;
      margin-bottom: 0.3rem;
    }

    .detail-headline {
      font-size: 1.4rem;
      line-height: 1.1;
      font-weight: 800;
      color: var(--scm-primary-dark);
    }

    .detail-subtitle {
      margin-top: 0.35rem;
      color: #5b6e82;
      font-size: 0.92rem;
    }

    .summary-quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .quick-field {
      border: 1px solid var(--scm-border);
      border-radius: 14px;
      padding: 0.75rem 0.85rem;
      background: rgba(255, 255, 255, 0.86);
    }

    .detail-section {
      border: 1px solid var(--scm-border);
      border-radius: 16px;
      padding: 1rem;
      background: #fbfdff;
    }

    .detail-section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--scm-primary-dark);
      margin-bottom: 0.85rem;
    }

    .reading-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.7rem;
    }

    .reading-card {
      border: 1px solid var(--scm-border);
      border-radius: 14px;
      padding: 0.75rem;
      background: #fff;
      min-width: 0;
    }

    .reading-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #708399;
      margin-bottom: 0.3rem;
    }

    .reading-value {
      display: block;
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--scm-ink);
      white-space: nowrap;
      word-break: normal;
    }

    .reading-card .form-control {
      white-space: nowrap;
    }

    .reading-note {
      border-top: 1px dashed var(--scm-border);
      padding-top: 0.85rem;
    }

    .detail-collapse {
      border-top: 1px solid var(--scm-border);
      padding-top: 0.9rem;
    }

    .detail-collapse summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--scm-primary-dark);
      list-style: none;
    }

    .detail-collapse summary::-webkit-details-marker {
      display: none;
    }

    @media (max-width: 991.98px) {
      .list-advanced-filters {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .summary-quick-grid {
        grid-template-columns: 1fr;
      }

      .reading-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .list-reading-grid {
        grid-template-columns: repeat(2, minmax(82px, 1fr));
        min-width: 176px;
      }

      .padron-list-scroll {
        max-height: 460px;
      }

      .detail-scroll-panel {
        max-height: 62vh;
        padding-right: 0.15rem;
      }
    }

    @media (max-width: 575.98px) {
      .list-advanced-filters {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div id="mainApp" class="d-none">
    <?!= include('Dashboard'); ?>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
